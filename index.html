<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#fff7e8" />
  <title>上班状态鉴定所</title>
  <style>
    :root{--ink:#1f2630;--paper:#fffaf0;--red:#ff5a4f;--yellow:#ffd447;--mint:#9ce7cf;--blue:#9bd6ff;--line:#202733;--shadow:5px 6px 0 var(--line)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 12% 8%,#ffe9a8 0 8%,transparent 9%),radial-gradient(circle at 92% 25%,#bdebdc 0 10%,transparent 11%),linear-gradient(135deg,#fff8e8,#fffdf7)}
    button{font:inherit;color:inherit}.shell{width:min(680px,100%);margin:auto;padding:24px 18px 48px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.badge{padding:8px 12px;border:2px solid var(--line);border-radius:999px;background:#fff;font-weight:800;font-size:13px;box-shadow:3px 3px 0 var(--line)}.stamp{font-size:29px;transform:rotate(8deg)}
    .card{border:3px solid var(--line);border-radius:24px;background:rgba(255,255,255,.93);box-shadow:var(--shadow);padding:clamp(22px,5vw,38px);overflow:hidden;position:relative}.card:after{content:"";position:absolute;width:92px;height:92px;border:16px solid rgba(255,90,79,.09);border-radius:50%;right:-28px;top:-30px}
    h1{font-size:clamp(35px,9vw,61px);line-height:1.02;margin:6px 0 16px;letter-spacing:-2px}.accent{background:linear-gradient(transparent 58%,var(--yellow) 58%)}.lead{font-size:17px;line-height:1.7;margin:0 0 26px;color:#4a5260}.warning{background:#fff0ee;border:2px dashed var(--red);border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:24px}
    .primary,.choice,.ghost{width:100%;border:2px solid var(--line);border-radius:14px;padding:15px 16px;font-weight:850;cursor:pointer;transition:.15s transform,.15s box-shadow}.primary{background:var(--red);color:white;box-shadow:4px 4px 0 var(--line);font-size:18px}.primary:active,.choice:active,.ghost:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
    .tiny{text-align:center;font-size:12px;color:#7b8290;margin:15px 0 0}.hidden{display:none}.progress-wrap{display:flex;align-items:center;gap:12px;margin-bottom:24px}.progress{height:14px;flex:1;border:2px solid var(--line);border-radius:99px;overflow:hidden;background:#fff}.bar{height:100%;width:0;background:var(--mint);transition:width .3s}.count{font-weight:900;font-size:13px}
    h2{font-size:clamp(25px,6vw,36px);line-height:1.25;margin:0 0 22px}.choices{display:grid;gap:12px}.choice{text-align:left;background:#fff;box-shadow:3px 3px 0 var(--line);font-size:16px}.choice:hover{background:#fff7ce;transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--line)}
    .result-tag{display:inline-block;background:var(--yellow);border:2px solid var(--line);border-radius:9px;padding:6px 10px;font-weight:900;transform:rotate(-2deg)}.score{font-size:64px;font-weight:950;line-height:1;margin:18px 0 4px}.score small{font-size:18px}.result-title{font-size:31px;margin:12px 0}.result-copy{font-size:17px;line-height:1.75;background:#f4fbff;border:2px solid var(--line);border-radius:14px;padding:16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px 0}.stat{border:2px solid var(--line);border-radius:13px;padding:12px 5px;text-align:center;background:#fff}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:#68707e}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ghost{background:#fff;box-shadow:3px 3px 0 var(--line)}
    .footer{text-align:center;margin-top:24px;color:#717886;font-size:12px}.confetti{position:fixed;top:-20px;width:10px;height:18px;animation:fall 1.9s linear forwards;z-index:20}@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
    @media(max-width:440px){.shell{padding-top:14px}.card{padding:22px 18px}.actions{grid-template-columns:1fr}.stats{gap:6px}.stamp{font-size:24px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}.confetti{display:none}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="top"><span class="badge">OFFICE FUN LAB</span><span class="stamp">🫠☕</span></div>
    <section id="start" class="card">
      <div class="badge" style="display:inline-block;background:var(--blue)">非正式 · 不科学 · 但很准</div>
      <h1>测测你的<br><span class="accent">上班人格</span></h1>
      <p class="lead">6 道灵魂拷问，鉴定你是职场卷王、带薪哲学家，还是工位隐身大师。</p>
      <div class="warning">⚠️ 温馨提示：测试结果仅供快乐，老板路过请立刻切换到 Excel。</div>
      <button class="primary" id="startBtn">开始鉴定（约 30 秒）</button>
      <p class="tiny">已有 99,999+ 位打工人假装认真测过</p>
    </section>
    <section id="quiz" class="card hidden" aria-live="polite">
      <div class="progress-wrap"><div class="progress"><div id="bar" class="bar"></div></div><span id="count" class="count"></span></div>
      <h2 id="question"></h2><div id="choices" class="choices"></div>
    </section>
    <section id="result" class="card hidden" aria-live="polite">
      <span class="result-tag">鉴定完成 ✓</span><div id="score" class="score"></div><h2 id="resultTitle" class="result-title"></h2><div id="resultCopy" class="result-copy"></div>
      <div class="stats"><div class="stat"><b id="stat1"></b><span>摸鱼雷达</span></div><div class="stat"><b id="stat2"></b><span>下班速度</span></div><div class="stat"><b id="stat3"></b><span>咖啡抗性</span></div></div>
      <div class="actions"><button class="primary" id="copyBtn">复制结果去逗同事</button><button class="ghost" id="againBtn">换个姿势再测</button></div><p class="tiny">测试不是 KPI，快乐才是。</p>
    </section>
    <div class="footer">上班状态鉴定所 · 请勿在重要会议中笑出声</div>
  </main>
  <script>
    const questions=[
      ["早上看到工作群 99+，你的第一反应是？",["先深呼吸，再假装没看见","精准搜索有没有人@我","立刻逐条回复，效率拉满","手机一扣：今天又是美好一天"]],
      ["领导说‘这个很简单’，你脑内自动翻译为？",["今晚可能回不去了","确实简单，我来","需求还没想好","先微笑，保护好自己"]],
      ["下午三点最适合做什么？",["开一杯续命咖啡","认真工作给大家看","研究今晚吃什么","给文件夹重新命名"]],
      ["同事问‘忙吗’，你会？",["先问什么事再决定忙不忙","秒回：忙，但你说","盯着消息变成已读不回","热心接活，事后后悔"]],
      ["距离下班还有五分钟，你正在？",["关掉 37 个网页标签","突然进入高效状态","身体还在，灵魂已打卡","主动问还有没有事情"]],
      ["周一最需要哪种超能力？",["一键跳到周五","让会议自动缩短","听懂所有职场黑话","工资按秒到账"]]
    ];
    const results=[
      {max:5,title:"工位隐身大师",copy:"你不是在摸鱼，你只是在为公司节约脑力资源。擅长在人群中保持低耗能运行，关键时刻还能精准出现。建议继续保持神秘，但偶尔动一下鼠标。",emoji:"🫥"},
      {max:10,title:"带薪哲学家",copy:"你的工位看似安静，脑内已经完成了三轮人生复盘。你深知工作只是生活的一部分，奶茶才是完整的一生。今日宜：从容下班。",emoji:"🧘"},
      {max:15,title:"气氛组扛把子",copy:"项目可以晚一点，群里的表情包不能迟到。你是办公室的情绪充电宝，同事靠你续命，老板偶尔也被你逗笑。",emoji:"🎉"},
      {max:20,title:"间歇性卷王",copy:"你能在摸鱼和爆发之间无缝切换：上午人淡如菊，下午战神附体。没人知道你的能量从哪来，包括你自己。",emoji:"⚡"},
      {max:24,title:"职场永动机",copy:"你对工作有一种近乎可疑的热情。消息秒回、文件秒交、会议还主动记笔记。请注意休息，你这样会显得同事很懒。",emoji:"🚀"}
    ];
    let index=0,total=0;
    const $=id=>document.getElementById(id); const show=id=>{["start","quiz","result"].forEach(x=>$(x).classList.toggle("hidden",x!==id));scrollTo({top:0,behavior:"smooth"})};
    function render(){const q=questions[index];$("count").textContent=`${index+1} / ${questions.length}`;$("bar").style.width=`${index/questions.length*100}%`;$("question").textContent=q[0];$("choices").innerHTML="";q[1].forEach((label,i)=>{const b=document.createElement("button");b.className="choice";b.textContent=`${String.fromCharCode(65+i)}. ${label}`;b.onclick=()=>{total+=i+1;index++;index<questions.length?render():finish()};$("choices").appendChild(b)})}
    function finish(){const score=Math.round(58+total/24*41),r=results.find(x=>total<=x.max)||results.at(-1);$("bar").style.width="100%";$("score").innerHTML=`${score}<small> 分</small>`;$("resultTitle").textContent=`${r.emoji} ${r.title}`;$("resultCopy").textContent=r.copy;$("stat1").textContent=`${Math.min(99,44+total*2)}%`;$("stat2").textContent=total%2?"0.8秒":"1.2秒";$("stat3").textContent=`${Math.max(1,Math.ceil(total/6))}杯`;show("result");confetti();window.testResult={score,title:r.title}}
    function confetti(){const colors=["#ff5a4f","#ffd447","#67d4b5","#78bff1"];for(let i=0;i<34;i++){const e=document.createElement("i");e.className="confetti";e.style.left=Math.random()*100+"vw";e.style.background=colors[i%4];e.style.animationDelay=Math.random()*.5+"s";document.body.appendChild(e);setTimeout(()=>e.remove(),2500)}}
    $("startBtn").onclick=()=>{index=0;total=0;show("quiz");render()};$("againBtn").onclick=()=>{index=0;total=0;show("start")};$("copyBtn").onclick=async()=>{const t=`我的上班人格是「${window.testResult.title}」，摸鱼指数 ${window.testResult.score} 分！你敢来测吗？`;try{await navigator.clipboard.writeText(t);$("copyBtn").textContent="已复制，快去群里炸场 ✓"}catch{prompt("复制这段结果：",t)}};
  </script>
</body>
</html>
