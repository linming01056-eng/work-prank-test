<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#111"><title>上班人格拍摄特效</title>
<style>
:root{--ink:#202733;--yellow:#ffd447;--mint:#91e4ca;--red:#ff5a4f;--paper:#fffaf0}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}button{font:inherit}.stage{position:relative;width:min(100vw,560px);height:100%;margin:auto;overflow:hidden;background:radial-gradient(circle at 50% 34%,#526171,#20252c 72%)}video,.fallback{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.fallback{display:grid;place-items:center;transform:none;background:linear-gradient(160deg,#3e4955,#16191e);color:#fff;text-align:center;padding:30px}.fallback b{font-size:58px;display:block}.fallback span{font-size:14px;opacity:.75}.shade{position:absolute;inset:0;background:linear-gradient(#0008 0,transparent 22%,transparent 62%,#000b 100%);pointer-events:none}.top{position:absolute;top:max(18px,env(safe-area-inset-top));left:18px;right:18px;display:flex;justify-content:space-between;align-items:center;color:white;font-weight:900}.brand{border:2px solid #fff;border-radius:999px;padding:7px 11px;font-size:12px;background:#1118}.camera-btn{border:0;border-radius:999px;background:#fff;color:#111;padding:9px 12px;font-weight:850}.screen{position:absolute;inset:0;padding:max(76px,calc(env(safe-area-inset-top) + 62px)) 16px max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:space-between}.hidden{display:none!important}.panel{background:#fffdf4f2;border:3px solid var(--ink);border-radius:22px;padding:18px;box-shadow:5px 6px 0 #202733}.tag{display:inline-block;border:2px solid var(--ink);background:var(--yellow);border-radius:9px;padding:5px 9px;font-size:12px;font-weight:950}.panel h1{font-size:clamp(32px,10vw,52px);line-height:1.04;margin:13px 0 9px;letter-spacing:-2px}.panel h2{font-size:clamp(22px,6.5vw,31px);line-height:1.22;margin:10px 0}.panel p{margin:8px 0;line-height:1.55}.start-panel{margin-top:auto;margin-bottom:4vh}.start-btn,.option,.action{border:3px solid var(--ink);border-radius:18px;font-weight:950;box-shadow:4px 5px 0 var(--ink);cursor:pointer}.start-btn{width:100%;padding:16px;background:var(--red);color:white;font-size:18px;margin-top:12px}.question-panel{margin-top:1vh}.progress{display:flex;gap:6px;margin-bottom:10px}.dot{height:8px;flex:1;border-radius:99px;background:#d9dce1}.dot.on{background:var(--mint)}.choose-note{text-align:center;color:white;font-size:13px;text-shadow:0 1px 4px #000;margin:auto 0 10px}.options{display:grid;grid-template-columns:1fr 1fr;gap:11px}.option{min-height:112px;padding:14px 10px;background:var(--yellow);font-size:16px}.option+button{background:var(--mint)}.option:active,.start-btn:active,.action:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}.result-panel{text-align:center;margin-top:auto;margin-bottom:3vh}.score{font-size:56px;font-weight:1000;line-height:1;margin:12px}.result-title{font-size:30px!important;margin:9px!important}.result-copy{font-size:14px;background:#edf9ff;border:2px solid var(--ink);border-radius:13px;padding:11px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.action{padding:13px 8px;background:var(--red);color:white}.action.secondary{background:white;color:var(--ink)}.toast{position:absolute;left:50%;bottom:28%;transform:translateX(-50%);background:#111e;color:#fff;padding:10px 15px;border-radius:999px;font-size:13px;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}.flash{position:absolute;inset:0;background:white;opacity:0;pointer-events:none}.flash.go{animation:flash .35s}@keyframes flash{50%{opacity:.85}}@media(min-width:561px){.stage{border-left:1px solid #333;border-right:1px solid #333}}
</style></head><body><main class="stage" id="stage"><video id="camera" autoplay playsinline muted></video><div id="fallback" class="fallback"><div><b>🫠</b><span>镜头未开启也能玩<br>点击右上角开启前置镜头</span></div></div><div class="shade"></div><header class="top"><span class="brand">OFFICE FUN CAM</span><button class="camera-btn" id="cameraBtn">📷 开镜头</button></header>
<section id="start" class="screen"><div></div><div class="panel start-panel"><span class="tag">非正式 · 不科学 · 但很准</span><h1>测测你的<br>上班人格</h1><p>对着镜头回答 6 道灵魂拷问，看看你是哪种打工人。</p><button id="startBtn" class="start-btn">开始拍摄式测试</button></div></section>
<section id="quiz" class="screen hidden" aria-live="polite"><div class="panel question-panel"><div id="progress" class="progress"></div><span id="counter" class="tag"></span><h2 id="question"></h2></div><div><p class="choose-note">👇 点击屏幕按钮选择</p><div id="options" class="options"></div></div></section>
<section id="result" class="screen hidden" aria-live="polite"><div></div><div class="panel result-panel"><span class="tag">鉴定完成 ✓</span><div id="score" class="score"></div><h2 id="resultTitle" class="result-title"></h2><div id="resultCopy" class="result-copy"></div><div class="actions"><button id="shareBtn" class="action">分享结果</button><button id="againBtn" class="action secondary">再测一次</button></div></div></section><div id="toast" class="toast"></div><div id="flash" class="flash"></div></main>
<script>
const questions=[["看到工作群 99+，你的第一反应？","假装没看见","精准找 @我"],["领导说‘这个很简单’，你听成？","今晚回不去了","需求还没想好"],["下午三点最适合做什么？","续命咖啡","研究晚饭"],["同事问‘忙吗’，你会？","先问什么事","已读但沉默"],["距离下班还有五分钟，你在？","关网页标签","灵魂已打卡"],["周一最需要什么超能力？","跳到周五","工资按秒到账"]];
const results=[{max:1,title:"🚀 职场永动机",copy:"消息秒回、任务秒交。请注意休息，你这样会显得同事很懒。"},{max:2,title:"⚡ 间歇性卷王",copy:"上午人淡如菊，下午战神附体，能量来源至今成谜。"},{max:3,title:"🎉 气氛组扛把子",copy:"项目可以晚一点，群里的表情包不能迟到。"},{max:4,title:"🧘 带薪哲学家",copy:"工作只是生活的一部分，奶茶才是完整的一生。"},{max:6,title:"🫥 工位隐身大师",copy:"你不是在摸鱼，只是在为公司节约脑力资源。"}];
const $=x=>document.getElementById(x);let index=0,total=0,stream=null,current=null;function show(id){["start","quiz","result"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}function toast(t){$("toast").textContent=t;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1800)}async function camera(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});$("camera").srcObject=stream;$("fallback").classList.add("hidden");$("cameraBtn").textContent="✓ 镜头已开"}catch(e){toast("未获得镜头权限，仍可继续测试")}}function render(){const q=questions[index];$("counter").textContent=`第 ${index+1} / 6 题`;$("question").textContent=q[0];$("progress").innerHTML=questions.map((_,i)=>`<i class="dot ${i<=index?'on':''}"></i>`).join("");$("options").innerHTML="";[q[1],q[2]].forEach((t,i)=>{const b=document.createElement("button");b.className="option";b.textContent=t;b.onclick=()=>{total+=i;index++;index<questions.length?render():finish()};$("options").appendChild(b)})}function finish(){current=results.find(x=>total<=x.max)||results.at(-1);const s=58+total*7;$("score").textContent=s+" 分";$("resultTitle").textContent=current.title;$("resultCopy").textContent=current.copy;show("result");$("flash").classList.add("go");setTimeout(()=>$("flash").classList.remove("go"),400)}async function share(){const text=`我的上班人格是「${current.title.replace(/^\S+ /,'')}」，摸鱼指数 ${58+total*7} 分！你也来测测：${location.href}`;try{if(navigator.share){await navigator.share({title:"上班人格拍摄特效",text,url:location.href})}else{await navigator.clipboard.writeText(text);toast("结果和链接已复制")}}catch(e){if(e.name!=="AbortError")toast("长按浏览器地址即可分享")}}$("cameraBtn").onclick=camera;$("startBtn").onclick=()=>{index=0;total=0;show("quiz");render()};$("againBtn").onclick=()=>{index=0;total=0;show("start")};$("shareBtn").onclick=share;
</script></body></html>
