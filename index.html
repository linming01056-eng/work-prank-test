<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7dd7ff">
<title>周末出来玩邀请函</title>
<meta name="description" content="一封叫朋友周末出来玩的搞笑邀请函。">
<style>
:root{--ink:#17253a;--cream:#fff5d8;--yellow:#ffd447;--coral:#ff6b57;--blue:#7dd7ff}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;color:var(--ink);background:var(--blue);font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}button{font:inherit}.shell{min-height:100svh;display:grid;place-items:center;position:relative;overflow:hidden;padding:54px 18px 28px;background:radial-gradient(circle at 12% 18%,#ffffffbf 0 44px,transparent 45px),radial-gradient(circle at 90% 82%,#ffffff73 0 70px,transparent 71px),var(--blue)}.ticker{position:absolute;inset:0 0 auto;height:38px;overflow:hidden;display:flex;align-items:center;color:#fff;background:var(--ink);font-size:13px;font-weight:900;letter-spacing:.12em;white-space:nowrap}.ticker span{animation:crawl 13s linear infinite}.sun{position:absolute;top:60px;right:-18px;width:108px;height:108px;display:grid;place-items:center;border:4px solid var(--ink);border-radius:50%;background:var(--yellow);font-size:58px;transform:rotate(10deg)}.card{width:min(100%,480px);position:relative;z-index:1;padding:22px;border:4px solid var(--ink);border-radius:26px;background:var(--cream);box-shadow:10px 12px 0 var(--ink);transform:rotate(-.5deg)}.top{display:flex;align-items:center;justify-content:space-between;padding-bottom:15px;border-bottom:2px dashed var(--ink);font-size:12px;font-weight:900}.stamp{padding:5px 9px;border:2px solid var(--ink);border-radius:6px;color:#fff;background:var(--coral);transform:rotate(-4deg)}.badge{float:right;margin-top:20px;width:74px;height:74px;display:grid;place-items:center;border:3px solid var(--ink);border-radius:18px;background:var(--yellow);box-shadow:4px 4px 0 var(--ink);font-size:42px;transform:rotate(7deg)}.eyebrow{margin:22px 0 7px;font-size:13px;font-weight:900;letter-spacing:.06em}h1,h2{margin:0;font-weight:1000;letter-spacing:-.06em;line-height:.98}h1{font-size:clamp(47px,14vw,76px)}h2{font-size:clamp(38px,10vw,55px)}em{color:var(--coral);font-style:normal}.lead{margin:18px 0;max-width:90%;font-size:16px;font-weight:700;line-height:1.65}.details{margin:18px 0;border-top:2px solid var(--ink)}.row{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:10px 0;border-bottom:2px solid var(--ink);font-weight:700}.row b{font-weight:1000}.actions{display:grid;gap:10px}.btn{height:52px;border:3px solid var(--ink);border-radius:14px;box-shadow:4px 5px 0 var(--ink);font-size:16px;font-weight:1000;cursor:pointer}.btn:active{transform:translate(3px,3px);box-shadow:1px 2px 0 var(--ink)}.yes,.share{color:#fff;background:var(--coral)}.no{background:#fff}.excuse{min-height:39px;margin:12px 0 0;padding:9px 11px;border:2px dashed var(--ink);border-radius:10px;background:#fff;font-size:12px;font-weight:800;line-height:1.5}.success{text-align:center;padding-top:8px}.success-emoji{font-size:72px;animation:pop .55s ease both}.success p{margin:18px auto;line-height:1.7;font-weight:700}.ticket{margin:22px 0;padding:16px;border:3px dashed var(--ink);background:var(--yellow);transform:rotate(1deg)}.ticket span,.ticket strong{display:block}.ticket span{font-size:19px;font-weight:1000}.ticket strong{margin-top:6px;font-size:12px}.share{width:100%}.back{margin-top:15px;border:0;background:transparent;text-decoration:underline;font-weight:800;cursor:pointer}footer{margin-top:17px;padding-top:12px;border-top:2px dashed var(--ink);text-align:center;font-size:11px;font-weight:800;opacity:.7}.hidden{display:none}@keyframes crawl{to{transform:translateX(-48%)}}@keyframes pop{from{transform:scale(.25) rotate(-20deg);opacity:0}to{transform:scale(1);opacity:1}}@media(max-width:420px){.shell{align-items:start;padding-top:60px}.card{padding:18px;box-shadow:7px 8px 0 var(--ink)}.badge{width:62px;height:62px;font-size:34px}.lead{max-width:100%}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<main class="shell">
<div class="sun" aria-hidden="true">☀</div>
<div class="ticker" aria-hidden="true"><span>周末组局成功 · 禁止放鸽子 · 吃喝玩乐 · 快乐有效期 48 小时 · 周末组局成功 · </span></div>
<section class="card" aria-live="polite">
<div class="top"><span class="stamp">特急通知</span><span>NO. 0001</span></div>
<div id="invite">
<div class="badge" aria-hidden="true">🕶️</div>
<p class="eyebrow">致：一到周末就失踪的朋友</p>
<h1>周末<br><em>出来玩</em>邀请函</h1>
<p class="lead">别在家里长蘑菇了！现正式邀请你加入本周末快乐局，出来吃饭、逛街、聊天、拍照。</p>
<div class="details">
<div class="row"><b>时间</b><span>本周末，等你回复</span></div>
<div class="row"><b>地点</b><span>哪里热闹去哪里</span></div>
<div class="row"><b>着装</b><span>适合拍照的那套</span></div>
</div>
<div class="actions">
<button class="btn yes" id="yes">我参加！带我一个</button>
<button class="btn no" id="no">我想在家躺着</button>
</div>
<p class="excuse" id="excuse">系统替你回复：我再躺五分钟，然后立刻出门。</p>
</div>
<div id="success" class="success hidden">
<div class="success-emoji">🎉</div>
<p class="eyebrow">报名成功 · 你已加入快乐局</p>
<h2>周末集合<br><em>少一个都不行</em></h2>
<p>请携带：好心情、空肚子，以及拍一百张照片的耐心。</p>
<div class="ticket"><span>凭此券可一起吃喝玩乐</span><strong>集合时间：群里聊，反正不准放鸽子</strong></div>
<button class="btn share" id="share">复制邀请，发给朋友</button>
<button class="back" id="back">再看一遍邀请函</button>
</div>
<footer>最终解释权归“周末必须见面委员会”所有</footer>
</section>
</main>
<script>
const excuses=["我再躺五分钟，然后立刻出门。","拒绝无效，你们必须派人来接我。","本人正在化妆，预计三小时后出现。","只要有人请奶茶，我现在就下楼。"];let i=0;
const invite=document.getElementById("invite"),success=document.getElementById("success"),excuse=document.getElementById("excuse");
document.getElementById("yes").onclick=()=>{invite.classList.add("hidden");success.classList.remove("hidden")};
document.getElementById("no").onclick=()=>{i=(i+1)%excuses.length;excuse.textContent="系统替你回复："+excuses[i]};
document.getElementById("back").onclick=()=>{success.classList.add("hidden");invite.classList.remove("hidden")};
document.getElementById("share").onclick=async function(){const text="周末紧急通知：你已被邀请参加“什么都不干大会”！时间：本周末；地点：哪里热闹去哪里。"+location.href;try{if(navigator.share){await navigator.share({title:"周末出来玩邀请函",text,url:location.href})}else{await navigator.clipboard.writeText(text);this.textContent="已复制，快去抓人！";setTimeout(()=>this.textContent="复制邀请，发给朋友",1800)}}catch(e){}};
</script>
</body>
</html>
